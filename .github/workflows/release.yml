name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.1.0). Leave blank for current branch."
        required: false

jobs:
  # Windows: build wrapper.exe (Go) â†’ Inno Setup .exe â†’ (optionally) sign.
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-go@v5
        with:
          go-version-file: wrapper/go.mod
          cache-dependency-path: wrapper/go.sum
      - run: npm ci

      - name: Bundle Google desktop OAuth client (when configured)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        shell: bash
        run: if [ -n "$GOOGLE_OAUTH_CLIENT_ID" ]; then node -e "require('fs').writeFileSync('scripts/google-oauth-client.json', JSON.stringify({clientId:process.env.GOOGLE_OAUTH_CLIENT_ID,clientSecret:process.env.GOOGLE_OAUTH_CLIENT_SECRET||''}))"; else echo "Google OAuth client not configured; App Password fallback remains available"; fi
      - run: npm test
      - name: Run Go wrapper tests
        working-directory: wrapper
        run: go test ./...

      - name: Build AMM.exe (tray wrapper)
        shell: bash
        working-directory: wrapper
        run: make build-win

      - name: Sign AMM.exe (best-effort)
        if: env.AZURE_CLIENT_ID != ''
        shell: powershell
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
        run: |
          dotnet tool install --global azuresigntool
          pwsh scripts/build/sign-windows.ps1 wrapper/dist/AMM.exe

      # v4.1.1: stage a portable Node runtime under runtime/ so the .exe
      # installer can bundle it (Inno's Source: "..\*" picks it up). Fixes
      # "Could not run the helper. Is Node installed?" on machines with no
      # system Node — the .exe path never provisioned it.
      - name: Bundle portable Node runtime
        shell: powershell
        env:
          NODE_VERSION: "20.18.1"   # bundled runtime; bump alongside setup-node above
        run: |
          $ErrorActionPreference = 'Stop'
          $ver  = $env:NODE_VERSION
          $base = "https://nodejs.org/dist/v$ver"
          $zip  = "node-v$ver-win-x64.zip"
          Write-Host "Downloading $base/$zip"
          Invoke-WebRequest -Uri "$base/$zip" -OutFile $zip
          # Verify against Node's official checksums before trusting the binary.
          Invoke-WebRequest -Uri "$base/SHASUMS256.txt" -OutFile SHASUMS256.txt
          $expected = ((Select-String -Path SHASUMS256.txt -Pattern ([regex]::Escape($zip))).Line -split '\s+')[0].ToLower()
          $actual   = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { Write-Error "Node checksum mismatch: $actual != $expected"; exit 1 }
          Write-Host "Checksum OK: $actual"
          Expand-Archive -Path $zip -DestinationPath node-extract -Force
          New-Item -ItemType Directory -Force -Path runtime | Out-Null
          Copy-Item (Join-Path "node-extract\node-v$ver-win-x64" "node.exe") "runtime\node.exe"
          Remove-Item $zip, SHASUMS256.txt, node-extract -Recurse -Force
          Write-Host "Bundled runtime: $(& 'runtime\node.exe' --version)"

      # v6.0: the native Windows dashboard uses Microsoft's Evergreen
      # WebView2 Runtime. Windows 11 and most Windows 10 devices already have
      # it; the installer registry-checks first and runs this tiny bootstrapper
      # only when needed. Verify Microsoft's Authenticode signature before the
      # executable is allowed into our installer payload.
      - name: Bundle Microsoft WebView2 Evergreen bootstrapper
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'runtime\MicrosoftEdgeWebView2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $dest
          $sig = Get-AuthenticodeSignature $dest
          if ($sig.Status -ne 'Valid') {
            Write-Error "WebView2 bootstrapper signature is not valid: $($sig.Status)"
            exit 1
          }
          if ($sig.SignerCertificate.Subject -notmatch 'Microsoft') {
            Write-Error "Unexpected WebView2 signer: $($sig.SignerCertificate.Subject)"
            exit 1
          }
          Write-Host "Verified WebView2 bootstrapper signer: $($sig.SignerCertificate.Subject)"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # v7.1: npm test (above) creates config.json + data/ in the checkout as
      # side effects. The .iss now excludes them, but scrub here too so no
      # user-state file can ever ride into the payload and clobber a real
      # install on upgrade. Belt AND suspenders — this bug reset users'
      # settings on every update and must never come back.
      - name: Scrub user-state files from installer payload
        shell: powershell
        run: |
          if (Test-Path config.json) { Remove-Item config.json -Force; Write-Host "removed config.json" }
          if (Test-Path data) { Remove-Item data -Recurse -Force; Write-Host "removed data/" }
          if (Test-Path .env) { Remove-Item .env -Force; Write-Host "removed .env" }

      - name: Build .exe via Inno Setup
        shell: powershell
        run: |
          $iss = "installer/amm.iss"
          if (-not (Test-Path $iss)) { Write-Error "Missing $iss"; exit 1 }
          # Pass package.json version as /DMyAppVersion so the installer
          # filename + Add/Remove Programs entry match the tag being built.
          # The .iss has an #ifndef fallback for local dev runs.
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "Building installer for version $version"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" $iss
          # Inno Setup writes to installer/dist/ by default
          Get-ChildItem installer/dist/ -Filter '*.exe'

      - name: Sign .exe (best-effort)
        if: env.AZURE_CLIENT_ID != ''
        shell: powershell
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
        run: |
          dotnet tool install --global azuresigntool
          $exe = (Get-ChildItem installer/dist/*.exe | Select-Object -First 1).FullName
          pwsh scripts/build/sign-windows.ps1 $exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: amm-windows
          path: installer/dist/*.exe

  # macOS: build wrapper (arm64 + amd64) â†’ .dmg â†’ notarize.
  build-mac:
    name: Build macOS .dmg
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-go@v5
        with:
          go-version-file: wrapper/go.mod
          cache-dependency-path: wrapper/go.sum
      - run: npm ci

      - name: Bundle Google desktop OAuth client (when configured)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        shell: bash
        run: if [ -n "$GOOGLE_OAUTH_CLIENT_ID" ]; then node -e "require('fs').writeFileSync('scripts/google-oauth-client.json', JSON.stringify({clientId:process.env.GOOGLE_OAUTH_CLIENT_ID,clientSecret:process.env.GOOGLE_OAUTH_CLIENT_SECRET||''}))"; else echo "Google OAuth client not configured; App Password fallback remains available"; fi
      - run: npm test
      - name: Run Go wrapper tests
        working-directory: wrapper
        run: go test ./...

      - name: Build AMM-darwin-* (tray wrapper, arm64 + amd64)
        working-directory: wrapper
        run: make build-mac

      - name: Build .dmg
        run: bash scripts/build/mac.sh

      - name: Notarize .dmg (best-effort)
        if: env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          bash scripts/build/notarize-mac.sh "$DMG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: amm-mac
          path: dist/*.dmg

  # Linux: build wrapper (amm-tray) â†’ .deb + .AppImage â†’ GPG-sign both.
  build-linux:
    name: Build Linux .deb + .AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-go@v5
        with:
          go-version-file: wrapper/go.mod
          cache-dependency-path: wrapper/go.sum
      - run: npm ci

      - name: Bundle Google desktop OAuth client (when configured)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        shell: bash
        run: if [ -n "$GOOGLE_OAUTH_CLIENT_ID" ]; then node -e "require('fs').writeFileSync('scripts/google-oauth-client.json', JSON.stringify({clientId:process.env.GOOGLE_OAUTH_CLIENT_ID,clientSecret:process.env.GOOGLE_OAUTH_CLIENT_SECRET||''}))"; else echo "Google OAuth client not configured; App Password fallback remains available"; fi
      - run: npm test

      - name: Install build prereqs (incl. GTK headers for systray CGO)
        run: |
          sudo apt-get update -qq
          # dpkg-sig was dropped from Ubuntu 24.04's default repos â€”
          # scripts/build/sign-linux.sh probes for it at runtime and skips
          # .deb signing gracefully when absent. The signing path only
          # runs if GPG_PRIVATE_KEY secret is set anyway.
          sudo apt-get install -y dpkg-dev fakeroot \
            gcc libgtk-3-dev libayatana-appindicator3-dev

      - name: Run Go wrapper tests
        working-directory: wrapper
        run: go test ./...

      - name: Build amm-tray (tray wrapper)
        working-directory: wrapper
        run: make build-linux

      - name: Build .deb
        run: bash scripts/build/deb.sh

      - name: Build .AppImage
        run: bash scripts/build/appimage.sh

      - name: Import GPG key (best-effort)
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format SHORT | awk '/^sec/ {gsub(\".*/\", \"\", $2); print $2; exit}')" >> "$GITHUB_ENV"

      - name: Sign artifacts (best-effort)
        if: env.GPG_KEY_ID != ''
        run: |
          DEB=$(ls dist/*.deb | head -1)
          APP=$(ls dist/*.AppImage | head -1)
          bash scripts/build/sign-linux.sh "$DEB" "$APP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: amm-linux
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.AppImage.sig

  # Combine artifacts into a GitHub Release.
  publish:
    name: Publish Release
    needs: [build-windows, build-mac, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Stage release assets
        run: |
          mkdir -p release

          # Full installers are the only Windows/Mac/Linux artifacts â€”
          # one-click setup is the only path we advertise. (The bare Go
          # wrapper is intentionally NOT shipped as a separate Release
          # asset; it'd be too easy to download by mistake.)
          find artifacts/amm-windows -type f -name '*.exe' -exec cp {} release/ \;
          find artifacts/amm-mac -type f -name '*.dmg' -exec cp {} release/ \;
          find artifacts/amm-linux -type f -name '*.deb' -exec cp {} release/ \;
          find artifacts/amm-linux -type f -name '*.AppImage' -exec cp {} release/ \;
          find artifacts/amm-linux -type f -name '*.AppImage.sig' -exec cp {} release/ 2>/dev/null \; || true

          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## Download the installer for your OS

            One-click setup. Download, double-click, follow the 10-step wizard.

            | Platform | Asset | How to install |
            |---|---|---|
            | Windows | `amm-setup-v*.exe` | Double-click, accept the SmartScreen prompt, follow the wizard. Sets up Telegram bot, CV parsing, scheduled batch â€” fully automatic. |
            | macOS | `amm-v*.dmg` | Open the DMG, drag the AMM folder into your Applications. Double-click "Run Setup.command" on first launch. |
            | Linux (Debian/Ubuntu) | `amm_*_all.deb` | `sudo dpkg -i amm_*_all.deb && amm setup` |
            | Linux (any distro) | `amm-v*-x86_64.AppImage` | `chmod +x amm-v*.AppImage && ./amm-v*.AppImage setup` |

            ### Verification

            Checksums for all assets are in `SHA256SUMS.txt`.
